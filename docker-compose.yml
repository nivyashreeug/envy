services:
  api:
    build:
      context: ./server
    container_name: envy-api
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    container_name: envy-client
    ports:
      - "8080:80"
    depends_on:
      - api

  mongo:
    image: mongo:8
    container_name: envy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: envy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo_data:
