services:
  api:
    build:
      context: ./server
    container_name: invisible-fee-api
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: invisible-fee-client
    ports:
      - "8080:80"
    depends_on:
      - api

  mongo:
    image: mongo:8
    container_name: invisible-fee-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
